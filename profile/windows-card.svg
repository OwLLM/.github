<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420">
  <defs>
    <linearGradient id="bgWin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#081016"/>
    </linearGradient>
    <linearGradient id="borderWin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3ec5d8"/>
      <stop offset="0.5" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#3ec5d8"/>
    </linearGradient>
    <linearGradient id="accentWin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="transparent"/>
      <stop offset="0.3" stop-color="#3ec5d8"/>
      <stop offset="0.7" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="btnWin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#3ec5d8"/>
    </linearGradient>
    <filter id="glowWin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowWin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="304" height="404" rx="24" fill="url(#bgWin)" stroke="url(#borderWin)" stroke-width="1.5" filter="url(#softGlowWin)"/>
  <rect x="60" y="28" width="200" height="3" rx="1.5" fill="url(#accentWin)" filter="url(#glowWin)"/>

  <!-- windows logo icon -->
  <g transform="translate(132, 64)" filter="url(#softGlowWin)">
    <rect x="0" y="0" width="25" height="25" rx="2" fill="#58a6ff"/>
    <rect x="29" y="0" width="25" height="25" rx="2" fill="#58a6ff" opacity="0.85"/>
    <rect x="0" y="29" width="25" height="25" rx="2" fill="#58a6ff" opacity="0.85"/>
    <rect x="29" y="29" width="25" height="25" rx="2" fill="#58a6ff" opacity="0.7"/>
  </g>

  <text x="160" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#58a6ff" letter-spacing="-0.02em">Windows</text>
  <text x="160" y="178" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#8b949e">10 / 11 · x64</text>

  <rect x="56" y="198" width="84" height="26" rx="13" fill="rgba(46,160,67,0.12)" stroke="rgba(46,160,67,0.45)" stroke-width="1"/>
  <circle cx="70" cy="211" r="4" fill="#3fb950"/>
  <text x="118" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#3fb950" letter-spacing="0.1em">SHIPPING</text>

  <rect x="152" y="198" width="100" height="26" rx="13" fill="rgba(62,197,216,0.1)" stroke="rgba(62,197,216,0.4)" stroke-width="1"/>
  <circle cx="166" cy="211" r="4" fill="#3ec5d8"/>
  <text x="214" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#3ec5d8" letter-spacing="0.1em">EV-SIGNED</text>

  <rect x="70" y="248" width="180" height="48" rx="14" fill="url(#btnWin)" filter="url(#glowWin)"/>
  <text x="160" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="0.02em">⬇ Setup.exe</text>

  <text x="48" y="340" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#58a6ff">▸</tspan> ~30 MB · native CUDA GPU server
  </text>
  <text x="48" y="365" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#58a6ff">▸</tspan> WSL2 sandbox · signed auto-updater
  </text>
</svg>