<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420">
  <defs>
    <linearGradient id="bgMac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161008"/>
    </linearGradient>
    <linearGradient id="borderMac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9248"/>
      <stop offset="0.5" stop-color="#d29922"/>
      <stop offset="1" stop-color="#ff9248"/>
    </linearGradient>
    <linearGradient id="accentMac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="transparent"/>
      <stop offset="0.3" stop-color="#ff9248"/>
      <stop offset="0.7" stop-color="#d29922"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="btnMac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e7681"/>
      <stop offset="1" stop-color="#8b949e"/>
    </linearGradient>
    <filter id="glowMac" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowMac" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="304" height="404" rx="24" fill="url(#bgMac)" stroke="url(#borderMac)" stroke-width="1.5" filter="url(#softGlowMac)"/>
  <rect x="60" y="28" width="200" height="3" rx="1.5" fill="url(#accentMac)" filter="url(#glowMac)"/>

  <text x="160" y="105" font-size="56" text-anchor="middle" fill="#e6edf3" filter="url(#softGlowMac)">🍎</text>
  <text x="160" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#f0883e" letter-spacing="-0.02em">macOS</text>
  <text x="160" y="178" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#8b949e">Apple Silicon · Metal</text>

  <rect x="110" y="198" width="100" height="26" rx="13" fill="rgba(210,153,34,0.1)" stroke="rgba(210,153,34,0.45)" stroke-width="1"/>
  <circle cx="124" cy="211" r="4" fill="#d29922"/>
  <text x="172" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#f0883e" letter-spacing="0.1em">NEXT</text>

  <rect x="70" y="248" width="180" height="48" rx="14" fill="url(#btnMac)" filter="url(#glowMac)"/>
  <text x="160" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="0.02em">🔔 Watch for Release</text>

  <text x="48" y="340" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#f0883e">▸</tspan> Metal payload · unified-memory model
  </text>
  <text x="48" y="365" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#f0883e">▸</tspan> Lima sandbox (cross-platform CI)
  </text>
</svg>