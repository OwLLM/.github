<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#0a1a25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3ec5d8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3ec5d8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <rect x="10" y="10" width="320" height="280" rx="20" ry="20" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)" opacity="0.35"/>

  <!-- Card background -->
  <rect x="8" y="8" width="324" height="284" rx="18" ry="18" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="24" y="8" width="292" height="3" rx="1.5" fill="url(#accent)" filter="url(#softGlow)" opacity="0.85"/>

  <!-- Subtle corner orb -->
  <circle cx="296" cy="36" r="28" fill="url(#accent)" opacity="0.045"/>

  <!-- OS Icon -->
  <text x="170" y="70" font-size="42" text-anchor="middle" dominant-baseline="middle">🪟</text>

  <!-- OS Name -->
  <text x="170" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#58a6ff" text-anchor="middle">Windows</text>

  <!-- Architecture -->
  <text x="170" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">10 / 11 · x64</text>

  <!-- Status badges -->
  <rect x="66" y="148" width="64" height="22" rx="11" fill="rgba(46,160,67,0.12)" stroke="#2ea043" stroke-width="1"/>
  <text x="98" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle" letter-spacing="0.08em">SHIPPING</text>

  <rect x="142" y="148" width="76" height="22" rx="11" fill="rgba(62,197,216,0.10)" stroke="#3ec5d8" stroke-width="1"/>
  <text x="180" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#3ec5d8" text-anchor="middle" letter-spacing="0.08em">EV-SIGNED</text>

  <!-- Download button -->
  <rect x="82" y="186" width="176" height="42" rx="10" fill="url(#btn)" filter="url(#glow)"/>
  <rect x="82" y="186" width="176" height="42" rx="10" fill="url(#btn)" opacity="0.95"/>
  <text x="170" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">⬇  Setup.exe</text>

  <!-- Feature list -->
  <text x="170" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">~30 MB · native CUDA GPU server</text>
  <text x="170" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">WSL2 sandbox · signed auto-updater</text>
</svg>
