<svg xmlns="http://www.w3.org/2000/svg" width="340" height="300" viewBox="0 0 340 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111820"/>
      <stop offset="100%" stop-color="#1a1510"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <linearGradient id="btn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6e7681"/>
      <stop offset="100%" stop-color="#8b949e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer glow -->
  <rect x="10" y="10" width="320" height="280" rx="20" ry="20" fill="none" stroke="url(#accent)" stroke-width="4" filter="url(#glow)" opacity="0.30"/>

  <!-- Card background -->
  <rect x="8" y="8" width="324" height="284" rx="18" ry="18" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="24" y="8" width="292" height="3" rx="1.5" fill="url(#accent)" filter="url(#softGlow)" opacity="0.85"/>

  <!-- Subtle corner orb -->
  <circle cx="296" cy="36" r="28" fill="url(#accent)" opacity="0.04"/>

  <!-- OS Icon: stylized apple -->
  <g transform="translate(146, 36)">
    <!-- Apple body -->
    <path d="M24,12 C16,12 10,18 10,28 C10,40 18,50 24,50 C30,50 38,40 38,28 C38,18 32,12 24,12 Z" fill="#f0883e"/>
    <!-- Top bite/indent -->
    <path d="M18,16 Q24,10 30,16 Q24,14 18,16 Z" fill="#0d1117" opacity="0.3"/>
    <!-- Leaf -->
    <ellipse cx="28" cy="10" rx="6" ry="3" fill="#3fb950" transform="rotate(-30, 28, 10)"/>
  </g>

  <!-- OS Name -->
  <text x="170" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f0883e" text-anchor="middle">macOS</text>

  <!-- Architecture -->
  <text x="170" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#8b949e" text-anchor="middle">Apple Silicon · Metal</text>

  <!-- Status badge -->
  <rect x="147" y="148" width="46" height="22" rx="11" fill="rgba(210,153,34,0.10)" stroke="#d29922" stroke-width="1"/>
  <text x="170" y="163" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#f0883e" text-anchor="middle" letter-spacing="0.08em">NEXT</text>

  <!-- Watch button -->
  <rect x="68" y="186" width="204" height="42" rx="10" fill="url(#btn)" filter="url(#glow)"/>
  <rect x="68" y="186" width="204" height="42" rx="10" fill="url(#btn)" opacity="0.95"/>
  <text x="170" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">🔔  Watch for Release</text>

  <!-- Feature list -->
  <text x="170" y="255" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Metal payload · unified-memory model</text>
  <text x="170" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Lima sandbox · cross-platform CI ready</text>
</svg>
