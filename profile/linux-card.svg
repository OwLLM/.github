<svg xmlns="http://www.w3.org/2000/svg" width="320" height="420" viewBox="0 0 320 420">
  <defs>
    <linearGradient id="bgLin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#09120d"/>
    </linearGradient>
    <linearGradient id="borderLin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39d353"/>
      <stop offset="0.5" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#39d353"/>
    </linearGradient>
    <linearGradient id="accentLin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="transparent"/>
      <stop offset="0.3" stop-color="#39d353"/>
      <stop offset="0.7" stop-color="#2ea043"/>
      <stop offset="1" stop-color="transparent"/>
    </linearGradient>
    <linearGradient id="btnLin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e95420"/>
      <stop offset="1" stop-color="#ff9248"/>
    </linearGradient>
    <filter id="glowLin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlowLin" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="8" y="8" width="304" height="404" rx="24" fill="url(#bgLin)" stroke="url(#borderLin)" stroke-width="1.5" filter="url(#softGlowLin)"/>
  <rect x="60" y="28" width="200" height="3" rx="1.5" fill="url(#accentLin)" filter="url(#glowLin)"/>

  <text x="160" y="105" font-size="56" text-anchor="middle" fill="#e6edf3" filter="url(#softGlowLin)">🐧</text>
  <text x="160" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#3fb950" letter-spacing="-0.02em">Linux</text>
  <text x="160" y="178" font-family="'SFMono-Regular', Consolas, monospace" font-size="13" font-weight="600" text-anchor="middle" fill="#8b949e">x86-64</text>

  <rect x="110" y="198" width="100" height="26" rx="13" fill="rgba(46,160,67,0.12)" stroke="rgba(46,160,67,0.45)" stroke-width="1"/>
  <circle cx="124" cy="211" r="4" fill="#3fb950"/>
  <text x="172" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="800" text-anchor="middle" fill="#3fb950" letter-spacing="0.1em">SHIPPING</text>

  <rect x="70" y="248" width="180" height="48" rx="14" fill="url(#btnLin)" filter="url(#glowLin)"/>
  <text x="160" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="0.02em">⬇ AppImage · .deb</text>

  <text x="48" y="340" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#3fb950">▸</tspan> AppImage runs unpacked (chmod +x)
  </text>
  <text x="48" y="365" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e">
    <tspan fill="#3fb950">▸</tspan> .deb for Debian / Ubuntu · GPU probes
  </text>
</svg>